name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON files
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done < <(find . -type f -name '*.json' -not -path './.git/*' | sort)
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find tools -type f -name '*.mjs' | sort)
      - name: Check Python package builder
        run: |
          python3 -m py_compile tools/package-skill/package.py
          python3 tools/package-skill/package.py
          test -s dist/ai-video-creator-ultimate.zip
          python3 -c "import zipfile; z=zipfile.ZipFile('dist/ai-video-creator-ultimate.zip'); assert 'ai-video-creator-ultimate/SKILL.md' in z.namelist(); assert 'ai-video-creator-ultimate/modules/scriptwriting.md' in z.namelist()"
      - name: Validate sample timeline
        run: |
          node tools/timeline-validator/validate.mjs examples/timelines/short-form.json
          node tools/timeline-validator/test.mjs
      - name: Generate starter composition
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai-video-creator-test"
          node tools/project-generator/generate.mjs examples/hyperframes-basic/project.json "$RUNNER_TEMP/ai-video-creator-test/generated"
          test -s "$RUNNER_TEMP/ai-video-creator-test/generated/index.html"
          test -s "$RUNNER_TEMP/ai-video-creator-test/generated/project.json"
      - name: Render real MP4 fixture with FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m py_compile tools/ffmpeg-render/render.py tools/ffmpeg-render/create_fixture.py tools/ffmpeg-render/test_validation.py
          python3 tools/ffmpeg-render/test_validation.py
          python3 tools/ffmpeg-render/create_fixture.py
          python3 tools/ffmpeg-render/render.py examples/render/ffmpeg-render-fixture.json --output "$RUNNER_TEMP/ai-video-render-test.mp4"
          test -s "$RUNNER_TEMP/ai-video-render-test.mp4"
          ffprobe -v error -show_streams -show_format -of json "$RUNNER_TEMP/ai-video-render-test.mp4" > "$RUNNER_TEMP/ffprobe-output.json"
          node tools/render-preflight/check-render.mjs "$RUNNER_TEMP/ffprobe-output.json" --expect-width 320 --expect-height 180 --expect-fps 24 --expect-duration 2 --require-audio
      - name: Check sample render metadata
        run: node tools/render-preflight/check-render.mjs examples/render/ffprobe-output.example.json --expect-width 1080 --expect-height 1920 --expect-fps 30 --expect-duration 30 --require-audio
